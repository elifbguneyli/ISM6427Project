<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weather</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>

  <main class="card">
    <p class="greeting" id="greeting"></p>

    <form id="search-form" class="search">
      <input id="city-input" type="text" placeholder="Search city..." autocomplete="off" />
      <button type="submit" aria-label="Search">🔍</button>
    </form>

    <div class="units">
      <button type="button" class="unit-btn active" data-unit="fahrenheit">°F</button>
      <button type="button" class="unit-btn" data-unit="celsius">°C</button>
    </div>

    <div id="weather" class="weather">
      <p class="location">Loading...</p>
      <p class="temp">--°</p>
      <p class="condition">--</p>
      <div class="details">
        <div class="detail">
          <span id="detail1-label" class="label">Feels like</span>
          <span id="detail1-value" class="value">--°</span>
        </div>
        <div class="detail">
          <span id="detail2-label" class="label">Humidity</span>
          <span id="detail2-value" class="value">--%</span>
        </div>
        <div class="detail">
          <span id="detail3-label" class="label">Wind</span>
          <span id="detail3-value" class="value">-- mph</span>
        </div>
      </div>
    </div>

    <div id="forecast" class="forecast"></div>

    <p id="error" class="error" hidden></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
